# Server port (optional, only if you want a fixed free port)
server:
  port: 9091   # or any free port

# MySQL datasource
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wallet_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # creates tables automatically if missing
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Flyway (optional, if you use migrations)
flyway:
  enabled: true
  baseline-on-migrate: true

# JWT security config
app:
  security:
    jwtSecret: mySuperSecureJWTSecretKey_2025_#abcd
    jwtExpirationMs: 86400000